<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequoia Road Trip · Aug 6–9, 2026</title>
<meta name="description" content="A 4-day Tesla road trip from Los Angeles to Sequoia National Park.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5; --card:#ffffff; --ink:#1f2422; --ink2:#5c635d; --line:#e7e5db;
  --accent:#3f7d4e; --accent-soft:#e7f1e8; --blue:#1d6fb8; --blue-soft:#e7f0f9;
  --amber:#9a6212; --amber-soft:#f8eed8; --coral:#b14a2a; --coral-soft:#f7e7df;
  --shadow:0 1px 2px rgba(20,30,40,.04),0 8px 24px rgba(20,30,40,.06);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
:lang(zh-Hant){line-height:1.75}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Fraunces,"Noto Serif TC",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}

.langtoggle{position:fixed;top:14px;right:16px;z-index:80;display:flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:3px;backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.langtoggle.scrolled{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
.langtoggle button{border:none;background:transparent;color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;line-height:1.2;transition:all .15s}
.langtoggle.scrolled button{color:var(--ink2)}
.langtoggle button.active{background:#fff;color:#173a22}
.langtoggle.scrolled button.active{background:var(--accent);color:#fff}

.hero{position:relative;overflow:hidden;color:#fff;background:#1a3322}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42}
.hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,28,18,.5),rgba(12,28,18,.85))}
.hero-inner{position:relative;padding:64px 0 52px}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#cfe3d4;font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(32px,5.5vw,56px);line-height:1.05;margin-bottom:16px}
.hero .sub{font-size:17px;color:#e8efe9;max-width:600px}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:500}

section{padding:40px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-size:27px}
.sec-head p{margin:0;color:var(--ink2);font-size:14px}

.heads{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 22px 18px;margin-top:-34px;position:relative;z-index:3}
.heads h3{font-size:18px;padding:18px 0 4px;display:flex;align-items:center;gap:9px}
.heads .lead{color:var(--ink2);font-size:13.5px;margin:0 0 12px}
.flaglist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.flag{border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.55}
.flag b{display:block;margin-bottom:2px;font-weight:600}
.f-amber{background:var(--amber-soft);color:#6c460c}
.f-coral{background:var(--coral-soft);color:#83321a}
.f-blue{background:var(--blue-soft);color:#15517f}
.f-green{background:var(--accent-soft);color:#255f36}

.snap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.snap-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.snap-card .lab{font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.snap-card .val{font-size:21px;font-weight:600;font-family:Fraunces,serif}
.snap-card .sub{font-size:11.5px;color:var(--ink2);margin-top:3px}

.daynav{position:sticky;top:0;z-index:20;background:rgba(250,249,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.daynav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
.daynav .wrap::-webkit-scrollbar{display:none}
.daynav a{flex:0 0 auto;font-size:13px;font-weight:500;color:var(--ink2);text-decoration:none;padding:7px 13px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.daynav a:hover{background:var(--card);border-color:var(--line);color:var(--ink)}

.day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;scroll-margin-top:64px}
.day-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day-badge{flex:0 0 auto;width:54px;height:54px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;line-height:1}
.day-badge .d{font-size:20px;font-family:Fraunces,serif}
.day-badge .m{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.day-head .ttl{flex:1;min-width:180px}
.day-head .ttl h3{font-size:20px}
.day-head .ttl .wd{font-size:12.5px;color:var(--ink2);font-weight:500;margin-top:2px}
.drive{flex:0 0 auto;font-size:12.5px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
.day-body{padding:20px 22px}
.route{font-size:13.5px;color:var(--ink2);margin:0 0 16px;line-height:1.65}
.routeflag{margin:0 0 16px;border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.55}
.subhead{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:18px 0 11px}
.subhead:first-child{margin-top:0}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;font-family:inherit;transition:transform .14s ease,box-shadow .14s ease;width:100%}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d8d5cc}
.card .thumb{aspect-ratio:16/10;background:#dfe6e0 center/cover no-repeat;position:relative}
.card.noimg .thumb{background:linear-gradient(135deg,#3f7d4e,#1a3322)}
.card.noimg .thumb::after{content:attr(data-name);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;padding:10px;text-align:center}
.card .cbody{padding:11px 13px 13px}
.card .cname{font-size:14px;font-weight:600;line-height:1.3}
.card .ctype{font-size:11.5px;color:var(--ink2);margin-top:3px}
.card .cdist{font-size:11px;color:var(--ink2);margin-top:6px;display:flex;align-items:center;gap:4px}
.card .ccost{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.pill{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(26,51,34,.85);color:#fff;backdrop-filter:blur(3px)}
.items.compact{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:11px}
.items.compact .card .thumb{aspect-ratio:16/9}
.items.compact .card .cname{font-size:13px}

.stay{display:flex;gap:16px;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;width:100%;transition:border-color .14s;margin-bottom:10px}
.stay:hover{border-color:#cdd6d0}
.stay .hthumb{flex:0 0 150px;background:#dfe6e0 center/cover no-repeat;min-height:118px}
.stay.noimg .hthumb{background:linear-gradient(135deg,#b06a2a,#1a3322)}
.stay .hbody{padding:14px 16px 14px 0;flex:1;min-width:0}
.stay .hname{font-size:15px;font-weight:600}
.stay .hmeta{font-size:12.5px;color:var(--ink2);margin-top:3px}
.stay .hprice{font-size:13px;font-weight:600;color:var(--blue);margin-top:8px}
.stay .hpark{font-size:12px;color:var(--ink2);margin-top:7px;display:flex;gap:6px;align-items:flex-start}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber);margin-bottom:8px}

.prac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.prac{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.prac h4{margin:0 0 7px;font-size:14px;font-family:Inter,"Noto Serif TC";font-weight:600;display:flex;align-items:center;gap:7px}
.prac p{margin:0;font-size:13px;color:var(--ink2);line-height:1.6}

.modal-bg{position:fixed;inset:0;background:rgba(15,25,18,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:28px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px;max-width:620px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal .mimg{aspect-ratio:16/9;background:#dfe6e0 center/cover no-repeat;position:relative}
.modal .mimg.noimg{background:linear-gradient(135deg,#3f7d4e,#1a3322)}
.mclose{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(15,25,18,.6);color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.mbody{padding:20px 24px 24px}
.mbody .mtype{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.mbody h3{font-size:23px;margin:5px 0 10px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mmeta span{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.mmeta .mcost{background:var(--accent-soft);border-color:transparent;color:#255f36}
.mbody .mdesc{font-size:14.5px;color:#333a35;line-height:1.7;margin:0 0 14px}
.mbody .mpark{font-size:13px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:14px;line-height:1.55}
.mactions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{font-size:13px;font-weight:600;padding:10px 15px;border-radius:11px;text-decoration:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:hover{filter:brightness(.97)}
.mmap{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#eef1ee}
.mmap iframe{width:100%;height:230px;border:0;display:block}

footer{padding:40px 0 60px;text-align:center;color:var(--ink2);font-size:13px}
footer .fdot{color:var(--accent)}
@media(max-width:560px){
  .stay{flex-direction:column}
  .stay .hthumb{flex:none;width:100%;aspect-ratio:16/9;min-height:0}
  .stay .hbody{padding:0 16px 16px}
  .hero-inner{padding:56px 0 40px}
}
</style>
</head>
<body>

<div class="langtoggle" id="langToggle">
  <button data-l="zh">中文</button><button data-l="en">EN</button>
</div>

<header class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-grad"></div>
  <div class="wrap hero-inner" id="heroInner"></div>
</header>

<div class="wrap"><div class="heads" id="heads"></div></div>
<section id="snap"><div class="wrap" id="snapWrap"></div></section>
<nav class="daynav"><div class="wrap" id="daynav"></div></nav>
<section style="padding-top:30px"><div class="wrap" id="days"></div></section>
<section id="practical"><div class="wrap" id="pracWrap"></div></section>
<footer><div class="wrap" id="footer"></div></footer>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mimg" id="mImg"><button class="mclose" id="mClose" aria-label="Close">×</button></div>
    <div class="mbody">
      <div class="mtype" id="mType"></div>
      <h3 id="mName"></h3>
      <div class="mmeta" id="mMeta"></div>
      <p class="mdesc" id="mDesc"></p>
      <div class="mpark" id="mPark" style="display:none"></div>
      <div class="mactions" id="mActions"></div>
      <div class="mmap" id="mMap"></div>
    </div>
  </div>
</div>

<script>

  grantGrove:"https://upload.wikimedia.org/wikipedia/commons/e/ec/USA%2C_Kalifornie%2C_Sequoia_The_General_Grant.JPG",
  kingsView:"https://upload.wikimedia.org/wikipedia/commons/1/11/ViewFromKingsCanyon.JPG",
  exeter:"https://upload.wikimedia.org/wikipedia/commons/a/ae/2009-0725-CA-Exeter.jpg"
};

/* ===== UI STRINGS ===== */
const UI={
  hero:{
    eyebrow:{en:'California · Summer 2026', zh:'加州 · 2026 年夏'},
    h1:{en:'To the giant trees<br>and back — four days.', zh:'四天，前往<br>巨杉之地。'},
    sub:{en:'Los Angeles → the Tejon & Visalia Superchargers → Three Rivers → Sequoia & Kings Canyon. Tap any stop for photos, drive time, costs and a map.',

  },
  heads:{

    flags:[
      {cls:'f-amber', en:{b:'Charge to 100% at Visalia', body:'There is essentially no Supercharging in Three Rivers or inside the park, and the climb burns range fast. Top off fully at the Valley Fuel Travel Plaza before heading up.'},
        zh:{b:'在 Visalia 充到 100%', body:'Three Rivers 與國家公園內基本上沒有超級充電站，而且上山非常耗電。上山前務必在 Valley Fuel Travel Plaza 充滿電。'}},
      {cls:'f-blue', en:{b:'No cell service in the park', body:'Signal is very poor to none in Giant Forest and Lodgepole. Download offline Google Maps and your stops before Three Rivers.'},

      {cls:'f-green', en:{b:'Friday timing works in your favor', body:'On weekends the Moro Rock/Crescent Meadow Road is shuttle-only. Aug 7 is a Friday, so you can drive it yourself — but lots fill by mid-morning; a free shuttle (8am–6pm) is the backup.'},

      {cls:'f-coral', en:{b:'$35 per vehicle · card only', body:'Sequoia & Kings Canyon entrance is $35/vehicle (7-day) or an America the Beautiful pass. The gate is cashless (card/phone only). No timed-entry reservation needed.'},
        zh:{b:'每車 $35 · 只收卡', body:'Sequoia 與 Kings Canyon 入園每車 $35（7 天），或用 America the Beautiful 通行證。閘口不收現金（只限信用卡／手機）。無需預約時段入園。'}}
    ]
  },
  snap:{
    h2:{en:'Trip at a glance', zh:'行程速覽'},
    sub:{en:'4 days · 3 nights at your Three Rivers Airbnb', zh:'4 天 · Three Rivers 民宿住 3 晚'},
    cards:[

/* ===== RENDER ===== */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function enc(o){ return esc(JSON.stringify(o)); }
function thumb(u,w){ const m=u&&u.match(/^(https:\/\/upload\.wikimedia\.org\/wikipedia\/commons)\/([0-9a-f])\/([0-9a-f]{2})\/(.+)$/); return m?`${m[1]}/thumb/${m[2]}/${m[3]}/${m[4]}/${w}px-${m[4]}`:u; }

function card(it){
  const badge = it.extra ? `<span class="pill">${p(UI.badge.extra)}</span>` : '';
  const t = it.img ? thumb(it.img,1280) : '';
  const bg = t ? `style="background-image:url('${t}')"` : '';
  const nm = dz(it,'name');
  const dist = dz(it,'dist');
  return `<button class="card" data-it='${enc(it)}'>
    <div class="thumb" ${bg} ${it.img?`data-full="${it.img}"`:''} data-name="${esc(nm)}"></div>
    <div class="cbody"><div class="cname">${esc(nm)}</div><div class="ctype">${esc(dz(it,'type'))}</div>
    ${dist?`<div class="cdist">${esc(dist)}</div>`:''}
    ${it.cost&&it.cost!=='—'?`<span class="ccost">${esc(dz(it,'cost'))}</span>`:''}</div>${badge}</button>`;
}
function stayCard(h){
  const t = h.img?thumb(h.img,1280):'';
  const bg = t?`style="background-image:url('${t}')"`:'';
  return `<button class="stay" data-it='${enc({...h,isStay:true})}'>
    <div class="hthumb" ${bg} ${h.img?`data-full="${h.img}"`:''}></div>
    <div class="hbody"><span class="tag">${p(UI.tag.stay)}</span>
    <div class="hname">${esc(dz(h,'name'))}</div><div class="hmeta">${esc(dz(h,'meta'))}</div>
    <div class="hprice">${esc(dz(h,'price'))}</div>
    <div class="hpark"><span>🔌</span><span>${esc(dz(h,'park'))}</span></div></div></button>`;
}

function renderHero(){
  $("#heroBg").style.backgroundImage=`url('${thumb(IMG.crescent,1280)}')`;
  const h=UI.hero;
  $("#heroInner").innerHTML=`<div class="eyebrow">${p(h.eyebrow)}</div><h1>${p(h.h1)}</h1><p class="sub">${p(h.sub)}</p>
    <div class="hero-stats">${p(h.stats).map(s=>`<span class="stat">${s}</span>`).join('')}</div>`;
}
function renderHeads(){
  const h=UI.heads;
  $("#heads").innerHTML=`<h3>${p(h.title)}</h3><p class="lead">${p(h.lead)}</p>
    <div class="flaglist">${h.flags.map(f=>`<div class="flag ${f.cls}"><b>${p({en:f.en.b,zh:f.zh.b})}</b>${p({en:f.en.body,zh:f.zh.body})}</div>`).join('')}</div>`;
}
function renderSnap(){
  const c=UI.snap;
  const cards=c.cards.map(cc=>`<div class="snap-card"><div class="lab">${p({en:cc.en.lab,zh:cc.zh.lab})}</div><div class="val">${cc.val}</div><div class="sub">${p({en:cc.en.sub,zh:cc.zh.sub})}</div></div>`).join('');
  $("#snapWrap").innerHTML=`<div class="sec-head"><h2>${p(c.h2)}</h2><p>${p(c.sub)}</p></div><div class="snap-grid">${cards}</div>`;
}
function renderDays(){
  const days=$("#days"), nav=$("#daynav"); days.innerHTML=''; nav.innerHTML='';
  D.forEach((day,i)=>{
    const mains=(day.items||[]).filter(x=>!x.extra);
    const extras=(day.items||[]).filter(x=>x.extra);
    const mainLbl = day.mainLabel ? p(day.mainLabel) : p(UI.subhead.main);
    const moreLbl = day.moreLabel ? p(day.moreLabel) : p(UI.subhead.more);
    let html=`<div class="day" id="day${i}">
      <div class="day-head">
        <div class="day-badge"><span class="d">${day.d}</span><span class="m">${day.m}</span></div>
        <div class="ttl"><h3>${esc(dz(day,'title'))}</h3><div class="wd">${esc(dz(day,'wd'))}</div></div>
        <div class="drive">🚗 ${esc(dz(day,'drive'))}</div>
      </div>
      <div class="day-body"><p class="route">${dz(day,'route')}</p>
      ${day.routeflag?`<div class="routeflag ${day.routeflag.cls}">${LANG==='zh'?day.routeflag.html_zh:day.routeflag.html}</div>`:''}`;
    if(mains.length){ html+=`<div class="subhead">${mainLbl}</div><div class="items">${mains.map(card).join('')}</div>`; }
    if(extras.length){ html+=`<div class="subhead">${moreLbl}</div><div class="items compact">${extras.map(card).join('')}</div>`; }
    if(day.stay && day.stay.length){ html+=`<div class="subhead">${p(UI.subhead.stay)}</div>${day.stay.map(stayCard).join('')}`; }
    html+=`</div></div>`;
    days.insertAdjacentHTML('beforeend', html);
    nav.insertAdjacentHTML('beforeend', `<a href="#day${i}">${LANG==='zh'?`${MNUM[day.m]}/${parseInt(day.d,10)}`:`${day.m} ${parseInt(day.d,10)}`}</a>`);
  });
  // two-tier image loader: thumb -> full -> gradient
  document.querySelectorAll('.thumb[data-full],.hthumb[data-full]').forEach(el=>{
    const cur=el.style.backgroundImage.slice(5,-2), full=el.dataset.full;
    const probe=new Image();
    probe.onerror=()=>{ if(full&&full!==cur){ el.style.backgroundImage=`url('${full}')`; const f=new Image(); f.onerror=()=>el.closest('.card,.stay')?.classList.add('noimg'); f.src=full; } else { el.closest('.card,.stay')?.classList.add('noimg'); } };
    probe.src=cur;
  });
}
function renderPrac(){
  const c=UI.prac;
  $("#pracWrap").innerHTML=`<div class="sec-head"><h2>${p(c.h2)}</h2><p>${p(c.sub)}</p></div>
    <div class="prac-grid">${c.cards.map(cc=>`<div class="prac"><h4>${p({en:cc.en.h4,zh:cc.zh.h4})}</h4><p>${p({en:cc.en.p,zh:cc.zh.p})}</p></div>`).join('')}</div>`;
}
function renderFooter(){ $("#footer").innerHTML=p(UI.footer); }

function renderAll(){
  document.documentElement.lang = LANG==='zh'?'zh-Hant':'en';
  renderHero(); renderHeads(); renderSnap(); renderDays(); renderPrac(); renderFooter();
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active', b.dataset.l===LANG));
}

/* ===== MODAL ===== */
const mb=$("#modalBg");
function openModal(it){
  const mImg=$("#mImg");
  mImg.style.backgroundImage = it.img?`url('${it.img}')`:'';
  mImg.classList.toggle('noimg', !it.img);
  $("#mType").textContent = dz(it,'type')||'';
  $("#mName").textContent = dz(it,'name');
  const cost = it.isStay ? dz(it,'price') : dz(it,'cost');
  const dist = dz(it,'dist');
  let meta='';
  if(dist) meta+=`<span>${esc(dist)}</span>`;
  if(cost && cost!=='—') meta+=`<span class="mcost">${esc(cost)}</span>`;
  $("#mMeta").innerHTML=meta;
  $("#mDesc").textContent = dz(it,'desc')||'';
  const pk=$("#mPark");
  if(it.isStay && (it.park||it.park_zh)){ pk.style.display='block'; pk.innerHTML=esc(dz(it,'park')); }
  else pk.style.display='none';
  const mapsUrl = GMAP[it.coords] || ('https://www.google.com/maps/search/?api=1&query='+it.coords);
  $("#mActions").innerHTML=`<a class="btn primary" href="${it.link}" target="_blank" rel="noopener">${p(UI.modal.info)}</a>
    <a class="btn" href="${mapsUrl}" target="_blank" rel="noopener">${p(UI.modal.maps)}</a>`;
  $("#mMap").innerHTML=`<iframe loading="lazy" src="https://maps.google.com/maps?q=${it.coords}&z=15&output=embed" title="map"></iframe>`;
  mb.classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){ mb.classList.remove('open'); $("#mMap").innerHTML=''; document.body.style.overflow=''; }
document.body.addEventListener('click', e=>{ const c=e.target.closest('[data-it]'); if(c) openModal(JSON.parse(c.getAttribute('data-it'))); });
$("#mClose").addEventListener('click', closeModal);
mb.addEventListener('click', e=>{ if(e.target===mb) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

$("#langToggle").addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; if(b.dataset.l!==LANG){ LANG=b.dataset.l; closeModal(); renderAll(); } });
const lt=$("#langToggle");
window.addEventListener('scroll', ()=>{ lt.classList.toggle('scrolled', window.scrollY>80); }, {passive:true});

renderAll();
</script>
</body>
</html>
